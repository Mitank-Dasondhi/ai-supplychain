<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Impact Tracker: India and Outside India</title>
<style>
/* =====================================================================
   1. DESIGN TOKENS  (the only place colours, fonts and sizes are defined)
   Light only. White page, soft pastel highlights.
   ===================================================================== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;

  /* one font for everything: titles, headings, body, buttons, charts */
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-title:22px; --fs-section:16px; --fs-body:14px; --fs-small:12.5px;

  /* neutrals */
  --bg:#ffffff; --surface:#ffffff; --soft:#f8f9fb; --text:#262b33; --muted:#6b7280; --border:#e6e8ec;

  /* highlight colours. Each has: -bg (soft background), -t (text on that background), -f (soft border), -c (dark chart colour, added below) */
  --blue-bg:#e9f2fd;   --blue-t:#2b5fae;   --blue-f:#a9c9f0;
  --orange-bg:#fdefdf; --orange-t:#a45a16; --orange-f:#f5c796;
  --green-bg:#e7f6ed;  --green-t:#237049;  --green-f:#a8dbbd;
  --yellow-bg:#fdf5d9; --yellow-t:#86680c; --yellow-f:#f3dc85;
  --purple-bg:#f1ebfb; --purple-t:#6a4aa8; --purple-f:#cbbcee;
  --red-bg:#fdecec;    --red-t:#b03a3a;    --red-f:#f2b0b0;
  --gray-bg:#f0f1f4;   --gray-t:#555b66;   --gray-f:#d3d6dc;

  /* dark chart colours: used for every bar, slice, column and legend swatch */
  --blue-c:#2f6fd0; --orange-c:#e07b1f; --green-c:#2e9a5f; --yellow-c:#d9a21b; --purple-c:#7b57c4; --red-c:#d24848; --teal-c:#1f8f9b; --pink-c:#c2468f; --gray-c:#7d8591;

  --accent:var(--blue-t); --accent-bg:var(--blue-bg);
  --radius-lg:12px; --radius-md:10px; --radius-sm:8px; --radius-pill:999px;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-body)/1.45 var(--font)}
button,input,select{font-family:var(--font);font-size:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--blue-f);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--font);color:var(--text);letter-spacing:0}
h1{font-size:var(--fs-title);margin:0 0 2px;font-weight:650}
.sub{color:var(--muted);font-size:var(--fs-small);margin-bottom:14px}
.muted{color:var(--muted)}

/* =====================================================================
   3. SWITCHER (region / market / season) AND TABS
   ===================================================================== */
.markets{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.mkt{padding:9px 18px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
.mkt:hover{background:var(--soft)}
.mkt.active{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue-f)}
.pill{display:inline-block;margin-left:8px;padding:0 8px;border-radius:var(--radius-pill);background:var(--gray-bg);color:var(--gray-t);font-size:12px;font-weight:600}
.mkt.active .pill,.tab.active .pill{background:var(--surface);color:var(--blue-t)}
.tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);white-space:nowrap;font-weight:550}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue-t);border-bottom-color:var(--blue-f)}
.tab .pill{margin-left:6px;padding:0 7px;font-size:11.5px}

/* =====================================================================
   4. SEARCH, BUTTONS, FILTER PANEL
   ===================================================================== */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text)}
.btn{padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--soft)}
.btn.on{background:var(--blue-bg);border-color:var(--blue-f);color:var(--blue-t)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:5px 12px;font-size:13px}
.filters{display:none;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:12px;margin-bottom:10px;background:var(--soft);border:1px solid var(--border);border-radius:var(--radius-lg)}
.filters.open{display:grid}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-small);color:var(--muted)}
select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13.5px;width:100%}

/* =====================================================================
   5. SUMMARY TILES  (grey = numbers only, coloured = click to filter)
   ===================================================================== */
.kpis{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.kpi-row{display:flex;flex-wrap:nowrap;gap:8px;align-items:stretch}
.kpi-row.clicks{overflow-x:auto;padding-bottom:2px}
.kpi{font:inherit;text-align:left;color:var(--text);border-radius:var(--radius-lg)}
.kpi .n{font-size:22px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.static{flex:1 1 0;min-width:140px;padding:12px 16px;background:var(--soft);border:1px solid var(--border);cursor:default}
.kpi.static .n{font-size:28px}
.kpi.click{flex:1 0 150px;padding:9px 12px 8px;cursor:pointer;border:1px solid var(--kc-f);background:var(--kc-bg)}
.kpi.click .n{color:var(--kc-t)}
.kpi.click .l{color:var(--text)}
.kpi.click::after{content:"Click to filter \203A";display:block;margin-top:3px;font-size:10.5px;color:var(--kc-t)}
.kpi.click:hover{filter:brightness(.97)}
.kpi.click.active{box-shadow:0 0 0 2px var(--kc-f)}
.kpi.click.active::after{content:"Filter on \00D7 click to clear"}
.k-Growing{--kc-bg:var(--green-bg);--kc-t:var(--green-t);--kc-f:var(--green-f)}
.k-Stable{--kc-bg:var(--yellow-bg);--kc-t:var(--yellow-t);--kc-f:var(--yellow-f)}
.k-Struggling{--kc-bg:var(--red-bg);--kc-t:var(--red-t);--kc-f:var(--red-f)}
.k-Unclear{--kc-bg:var(--gray-bg);--kc-t:var(--gray-t);--kc-f:var(--gray-f)}

/* =====================================================================
   6. STATUS LINE, CHIPS, TABLE, BADGES, ROW DETAIL
   ===================================================================== */
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:6px 0 8px;color:var(--muted);font-size:13px}
.status b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--blue-bg);color:var(--blue-t);font-size:12px;border:0}
.chip:hover{filter:brightness(.96)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:var(--fs-small);font-weight:600;color:var(--muted);background:var(--soft);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th[aria-sort="ascending"]::after{content:" \25B2";font-size:.8em}
th[aria-sort="descending"]::after{content:" \25BC";font-size:.8em}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--soft)}
tbody tr.row.open{background:var(--blue-bg)}
td.num{color:var(--muted);width:48px}
td.name{font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:550;white-space:nowrap}
.b-Growing{background:var(--green-bg);color:var(--green-t)}
.b-Stable{background:var(--yellow-bg);color:var(--yellow-t)}
.b-Struggling{background:var(--red-bg);color:var(--red-t)}
.b-Unclear{background:var(--gray-bg);color:var(--gray-t)}
tr.detail td{background:var(--soft);padding:14px 16px}
dl.d{display:grid;grid-template-columns:minmax(130px,200px) 1fr;gap:6px 16px;margin:0}
dl.d dt{color:var(--muted);font-size:var(--fs-small)}
dl.d dd{margin:0;overflow-wrap:anywhere}
.empty{padding:36px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center}

/* =====================================================================
   7. CARDS, NOTICES, PROBLEM, LOADING  (README, Sources, errors)
   ===================================================================== */
.doc{display:flex;flex-direction:column;gap:14px;max-width:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.card h2{margin:0 0 4px;font-size:var(--fs-section);font-weight:650}
.card p{margin:6px 0}
.lead{color:var(--muted)}
.fine{font-size:var(--fs-small);color:var(--muted);margin:8px 0 0}
.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 16px;margin:8px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.notice{margin:0 0 8px;padding:9px 12px;border-radius:var(--radius-md);background:var(--yellow-bg);color:var(--text);border:1px solid var(--yellow-f);font-size:13px}
.problem{margin:8px 0;padding:14px 16px;border-radius:var(--radius-lg);background:var(--red-bg);border:1px solid var(--red-f);color:var(--text);max-width:760px}
.problem h3{margin:0 0 6px;font-size:15px;font-weight:650;color:var(--red-t)}
.problem p{margin:4px 0}
.loading{padding:18px 4px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.sw{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;font-size:12px;background:var(--surface)}
.sw .three{display:flex;height:34px}
.sw .three i{flex:1}
.sw span{display:block;padding:6px 8px}
.sw span b{display:block}
.typeline{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border)}
.typeline:last-child{border-bottom:0}
.typeline small{color:var(--muted);min-width:150px;font-size:12px}

/* =====================================================================
   8. CHARTS  (plain HTML and SVG, no libraries)
   Rule 0: charts and legends always use the dark -c colours, never the light ones.
   Rule 1: a chart with one series is always blue.
   Rule 2: charts with several series use blue, orange, green, yellow, purple, red, teal, pink in that order. "Other" is always grey.
   Rule 3: status colours never change: Growing green, Stable yellow, Struggling red, Unclear grey.
   ===================================================================== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.bars{display:flex;flex-direction:column;gap:3px}
.brow{display:grid;grid-template-columns:minmax(100px,170px) 1fr auto;gap:8px;align-items:center;padding:2px 4px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:var(--radius-sm);width:100%}
.brow.click{cursor:pointer}
.brow.click:hover{background:var(--soft)}
.bl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;background:var(--gray-bg);border-radius:7px;overflow:hidden;display:flex}
.fill{height:100%;background:var(--blue-c);border-radius:7px 0 0 7px;min-width:2px}
.bv{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.donutcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:190px}
svg.donut{width:130px;height:130px}
svg.donut circle{cursor:default}
.legend{display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:190px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend b{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:6px;overflow-x:auto}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--muted)}
.col .bar{width:100%;background:var(--blue-c);border-radius:5px 5px 0 0;min-height:2px}
.col:hover .bar{filter:brightness(.95)}
.col .cv{color:var(--text);font-weight:600;margin-bottom:2px}
.col .cl{margin-top:4px;white-space:nowrap}

/* =====================================================================
   9. HOVER INFORMATION (one tooltip style for the whole site)
   ===================================================================== */
.tip{position:fixed;z-index:50;display:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 14px rgba(38,43,51,.12);color:var(--muted);padding:7px 10px;border-radius:var(--radius-sm);font-size:var(--fs-small);pointer-events:none;max-width:280px}
.tip-h{color:var(--text);font-weight:600}

/* =====================================================================
   10. PHONES
   ===================================================================== */
@media (max-width:700px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:620px){ .two{grid-template-columns:1fr} }
@media (max-width:600px){
  .wrap{padding:12px}
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:8px}
  dl.d{grid-template-columns:1fr;gap:0}
  dl.d dt{margin-top:8px}
}

/* =====================================================================
   11. EXTRA RULES THIS SITE NEEDS (colour variables only)
   ===================================================================== */
.k-Confirmed{--kc-bg:var(--green-bg);--kc-t:var(--green-t);--kc-f:var(--green-f)}
.k-Planned{--kc-bg:var(--yellow-bg);--kc-t:var(--yellow-t);--kc-f:var(--yellow-f)}
.k-Unconfirmed{--kc-bg:var(--blue-bg);--kc-t:var(--blue-t);--kc-f:var(--blue-f)}
.k-None{--kc-bg:var(--gray-bg);--kc-t:var(--gray-t);--kc-f:var(--gray-f)}
.k-Capacity{--kc-bg:var(--purple-bg);--kc-t:var(--purple-t);--kc-f:var(--purple-f)}
.k-Delay{--kc-bg:var(--red-bg);--kc-t:var(--red-t);--kc-f:var(--red-f)}
.b-Confirmed{background:var(--green-bg);color:var(--green-t)}
.b-Planned{background:var(--yellow-bg);color:var(--yellow-t)}
.b-Unconfirmed{background:var(--blue-bg);color:var(--blue-t)}
.b-None{background:var(--gray-bg);color:var(--gray-t)}
.status .left{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.track.tall{height:20px}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:650;overflow:hidden}
.sublegend{display:flex;flex-wrap:wrap;gap:12px;font-size:var(--fs-small);margin:6px 0 8px}
.sublegend span{display:inline-flex;align-items:center;gap:6px}
.sublegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
.scroll{overflow-x:auto}
table.plain{min-width:0;width:100%}
table.plain td:first-child{white-space:nowrap;font-weight:600}
td.wrapcell{min-width:260px}
.biglist{margin-top:8px;max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.biglist .it{padding:7px 10px;border-bottom:1px solid var(--border);font-size:var(--fs-small)}
.biglist .it:last-child{border-bottom:0}
.biglist .it b{font-weight:600}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips2 span{padding:3px 10px;border-radius:var(--radius-pill);background:var(--gray-bg);font-size:var(--fs-small)}
.chips2 span b{margin-left:4px;color:var(--accent)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:12px}
.gcard{border:1px solid var(--border);border-left:5px solid var(--gray-c);border-radius:var(--radius-md);padding:12px 14px;background:var(--soft)}
.gcard .gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.gcard .gt{font-size:var(--fs-section);font-weight:700}
.gcard .gn{font-size:var(--fs-small);color:var(--muted)}
.gcard .ex{font-size:var(--fs-small);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.gcard .ex b{display:block}
.gcard .ex div{margin:4px 0}

</style>
</head>
<body>
<div class="wrap">
  <h1>AI Impact Tracker: India and Outside India</h1>
  <div class="sub" id="topsub">Source: Google Sheet “AI Impact Tracker”.</div>
  <div id="app"><div class="loading">Loading the data…</div></div>
</div>
<script>
/* ===== SETTINGS you can change (everything else reads from data.csv) ===== */
const CONFIG={
  sheetTitle:'AI Impact Tracker',   // name shown as the source of the data
  sheetUrl:'https://docs.google.com/spreadsheets/d/1s-iK9lUTm_CSLZl71nGRbgIfFkFj2sh-MmHSAF8Oe7M/edit',  // link on the Sources tab ('' to hide)
  dataFile:'data.csv',              // the company list
  keyFile:'key.csv',                // optional: plain meanings of labels (README tab)
  pageSize:10                       // companies shown per page in the table
};
let DATA={};      // filled from data.csv
let KEY=[];       // filled from key.csv (optional)
let DATA_DATE=''; // newest 'Last updated' value found in data.csv
const SHEET_TITLE=CONFIG.sheetTitle, SHEET_URL=CONFIG.sheetUrl;
const SURE_ORDER=['Confirmed','Planned','Unconfirmed','-'];
const SURE_LABEL={'Confirmed':'Confirmed','Planned':'Planned','Unconfirmed':'Unconfirmed','-':'No recent event'};
const SURE_CLASS={'Confirmed':'Confirmed','Planned':'Planned','Unconfirmed':'Unconfirmed','-':'None'};
const SURE_COLOR={'Confirmed':'var(--green-c)','Planned':'var(--yellow-c)','Unconfirmed':'var(--blue-c)','-':'var(--gray-c)'};
const SURE_TEXT={'Confirmed':'var(--surface)','Planned':'var(--text)','Unconfirmed':'var(--surface)','-':'var(--surface)'};
const sureLabel=v=>SURE_LABEL[v]||v;
const sureClass=v=>SURE_CLASS[v]||'None';
const sureColor=v=>SURE_COLOR[v]||'var(--gray-c)';
const sureText=v=>SURE_TEXT[v]||'var(--surface)';
const SERIES=['blue','orange','green','yellow','purple','red','teal','pink'];
const series=i=>'var(--'+SERIES[i%SERIES.length]+'-c)';
const BLUE='var(--blue-c)', GRAY='var(--gray-c)';

/* ---------- shared helpers ---------- */
function h(tag, attrs){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){ const v=attrs[k]; if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else e.setAttribute(k,v); }
  for(let i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  }
  return e;
}
function safeUrl(u){ return /^https?:\/\//i.test(u) ? u : null; }
function aLink(url,label){
  const u=safeUrl(url);
  return u ? h('a',{href:u,target:'_blank',rel:'noopener noreferrer',text:label||url,'data-tip':'Opens in a new tab'}) : document.createTextNode(label||url);
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function section(title, intro){
  const s=h('section',{class:'card'});
  s.append(h('h2',{text:title}));
  if(intro) s.append(h('p',{class:'lead',text:intro}));
  return s;
}
const splitMulti=v=>String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
const layerNum=s=>{ const m=/^(\d+)/.exec(s); return m?Number(m[1]):99; };
const layerColor=l=>layerNum(l)>=99?GRAY:series(layerNum(l)-1);
const pct=(n,t)=>(t?(n*100/t):0).toFixed(1)+'%';
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
const keyRows=kind=>KEY.filter(r=>r[1]===kind);
const keyMeaning=(kind,item)=>{ const r=KEY.find(x=>x[1]===kind&&x[0]===item); return r?r[2]:''; };
const tipText=(...parts)=>parts.filter(Boolean).join('|');

function donut(items,total,topText,bottomText){
  const svg=svgEl('svg',{viewBox:'0 0 120 120','class':'donut',role:'img','aria-label':topText+' '+bottomText+': '+items.map(i=>i.label+' '+i.value).join(', ')});
  const r=44, C=2*Math.PI*r; let off=0;
  const bg=svgEl('circle',{cx:60,cy:60,r:r,fill:'none','stroke-width':20}); bg.style.stroke='var(--gray-bg)'; svg.append(bg);
  items.forEach(it=>{
    if(!it.value) return;
    const len=C*it.value/total;
    const c=svgEl('circle',{cx:60,cy:60,r:r,fill:'none','stroke-width':20,'stroke-dasharray':len+' '+(C-len),'stroke-dashoffset':-off,transform:'rotate(-90 60 60)','data-tip':tipText(it.label,`${it.value} companies`,`${pct(it.value,total)} of the list`)});
    c.style.stroke=it.color;
    svg.append(c); off+=len;
  });
  const t1=svgEl('text',{x:60,y:58,'text-anchor':'middle','font-size':18,'font-weight':700}); t1.style.fill='var(--text)'; t1.textContent=topText;
  const t2=svgEl('text',{x:60,y:73,'text-anchor':'middle','font-size':8}); t2.style.fill='var(--muted)'; t2.textContent=bottomText;
  svg.append(t1,t2);
  return svg;
}
function legend(items,total){
  const box=h('div',{class:'legend'});
  items.forEach(it=>{
    const sw=h('i'); sw.style.background=it.color;
    box.append(h('div',{'data-tip':tipText(it.label,`${it.value} companies`,`${pct(it.value,total)} of the list`)},sw,h('span',{text:it.label}),h('b',{text:`${it.value} · ${pct(it.value,total)}`})));
  });
  return box;
}
function bars(entries,total,onClick,colorFn){
  const max=Math.max(1,...entries.map(e=>e[1]));
  const wrap=h('div',{class:'bars'});
  entries.forEach(([label,val,key])=>{
    const clickable=onClick && key!==null;
    const row=h(clickable?'button':'div',{class:'brow'+(clickable?' click':''),'data-tip':tipText(label,`${val} companies`,`${pct(val,total)} of the list`,clickable?'Click to see these companies':'')});
    if(clickable){ row.type='button'; row.addEventListener('click',()=>onClick(key===undefined?label:key)); }
    const fill=h('div',{class:'fill'}); fill.style.width=(val/max*100)+'%';
    if(colorFn) fill.style.background=colorFn(label,key);
    row.append(h('span',{class:'bl',text:label}),h('div',{class:'track'},fill),h('span',{class:'bv',text:`${val} · ${pct(val,total)}`}));
    wrap.append(row);
  });
  return wrap;
}
function linkified(text){
  const box=h('span');
  const s=String(text||'');
  const re=/https?:\/\/[^\s;]+/g; let last=0, m;
  while((m=re.exec(s))){ if(m.index>last) box.append(document.createTextNode(s.slice(last,m.index))); box.append(aLink(m[0],m[0])); last=m.index+m[0].length; }
  if(last<s.length) box.append(document.createTextNode(s.slice(last)));
  return box;
}

function createMarket(M){
  const COLS=M.cols, ROWS=M.rows, N=ROWS.length, PS=Math.max(1,Number(CONFIG.pageSize)||10);
  const I={}; COLS.forEach((c,i)=>I[c]=i);

  root.innerHTML=marketTemplate(M);
  const $=id=>root.querySelector('[data-id="'+id+'"]');
  const col=(r,name)=>(r[I[name]]||'').trim();
  const countMap=fn=>{ const m=new Map(); ROWS.forEach(r=>{ [].concat(fn(r)).forEach(k=>m.set(k,(m.get(k)||0)+1)); }); return m; };
  const uniq=name=>countMap(r=>col(r,name));
  const multi=name=>countMap(r=>{ const a=splitMulti(col(r,name)); return a.length?[...new Set(a)]:['Not stated']; });
  const sureList=()=>SURE_ORDER.concat([...uniq('How sure').keys()].filter(v=>!SURE_ORDER.includes(v)&&v!==''));
  const FILTER_KEYS=['layer','type','kind','event','sure','country','level'];
  const state={q:'',layer:'',type:'',kind:'',event:'',sure:'',country:'',level:'',sort:'S.No',dir:1,page:1};
  const sortedEntries=(map,byCount)=>{ const a=[...map.entries()]; a.sort(byCount?(x,y)=>y[1]-x[1]||String(x[0]).localeCompare(String(y[0])):(x,y)=>String(x[0]).localeCompare(String(y[0]))); return a; };

  /* ===== Companies tab ===== */
  function fillSelect(sel, items, anyLabel){
    sel.textContent='';
    sel.appendChild(h('option',{value:'',text:anyLabel}));
    items.forEach(([val,label])=>sel.appendChild(h('option',{value:val,text:label})));
  }
  function buildFilters(){
    const lay=[...uniq('Layer').entries()].sort((a,b)=>layerNum(a[0])-layerNum(b[0]));
    fillSelect($('f-layer'),lay.map(([v,n])=>[v,`${v} (${n})`]),'All layers');
    fillSelect($('f-type'),sortedEntries(uniq('Type'),true).map(([v,n])=>[v,`${v} (${n})`]),'All types');
    fillSelect($('f-kind'),sortedEntries(uniq('Company kind'),true).map(([v,n])=>[v,`${v} (${n})`]),'All kinds');
    fillSelect($('f-event'),sortedEntries(multi('What happened'),true).map(([v,n])=>[v,`${v} (${n})`]),'Any event');
    const sm=uniq('How sure');
    fillSelect($('f-sure'),sureList().filter(v=>sm.has(v)).map(v=>[v,`${sureLabel(v)} (${sm.get(v)})`]),'Any');
    fillSelect($('f-country'),sortedEntries(multi('Country'),true).map(([v,n])=>[v,`${v} (${n})`]),'All countries');
    fillSelect($('f-level'),sortedEntries(uniq('Supply chain level'),false).map(([v,n])=>[v,`${v} (${n})`]),'All levels');
  }
  function matches(r){
    if(state.layer && col(r,'Layer')!==state.layer) return false;
    if(state.type && col(r,'Type')!==state.type) return false;
    if(state.kind && col(r,'Company kind')!==state.kind) return false;
    if(state.sure && col(r,'How sure')!==state.sure) return false;
    if(state.level && col(r,'Supply chain level')!==state.level) return false;
    if(state.event && !splitMulti(col(r,'What happened')).includes(state.event)) return false;
    if(state.country && !splitMulti(col(r,'Country')).includes(state.country)) return false;
    if(state.q){
      const hay=r.join(' \u0001 ').toLowerCase();
      for(const t of state.q.toLowerCase().split(/\s+/).filter(Boolean)){ if(!hay.includes(t)) return false; }
    }
    return true;
  }
  function sortRows(list){
    const k=state.sort, dir=state.dir, out=list.slice();
    const C=r=>col(r,'Company'), sno=(a,b)=>Number(col(a,'S.No'))-Number(col(b,'S.No'));
    let cmp;
    if(k==='S.No') cmp=sno;
    else if(k==='Layer') cmp=(a,b)=>layerNum(col(a,'Layer'))-layerNum(col(b,'Layer'))||C(a).localeCompare(C(b));
    else cmp=(a,b)=>col(a,k).localeCompare(col(b,k),undefined,{numeric:true})||C(a).localeCompare(C(b));
    out.sort((a,b)=>(cmp(a,b)||sno(a,b))*dir);
    return out;
  }
  const TCOLS=[['S.No','S.No','num'],['Company','Company','name'],['Layer','Layer'],['Type','Type'],['Company kind','Kind'],['Country','Country'],['City','City'],['What happened','What happened'],['How sure','How sure'],['Last updated','Updated','num']];
  const COLTIP={'S.No':'Row number in the sheet','Company':'Company name','Layer':'Where it sits in the AI chain','Type':'What it mainly makes or does','Company kind':'What kind of company it is','Country':'Where its main work happens','City':'City of its main work','What happened':'The kind of recent event found','How sure':'How sure the latest news is','Last updated':'When the row was last checked'};
  function td(text,cls){
    const c=h('td',cls?{class:cls}:null);
    if(text===''){ c.append(h('span',{class:'muted',text:'—'})); } else c.textContent=text;
    return c;
  }
  function detailRow(r){
    const dl=h('dl',{class:'d'});
    COLS.forEach((cname,i)=>{
      const v=r[i]; const dd=h('dd');
      if(v===''){ dd.className='muted'; dd.textContent='— (blank in sheet)'; }

      dl.append(h('dt',{text:cname}),dd);
    });
    return h('tr',{class:'detail'},h('td',{colspan:String(TCOLS.length)},dl));
  }
  function activeFilters(){
    return [['q','Search'],['layer','Layer'],['type','Type'],['kind','Kind'],['event','Event'],['sure','How sure'],['country','Country'],['level','Level']].filter(([k])=>state[k]);
  }
  function renderTable(){
    hideTip();
    const all=sortRows(ROWS.filter(matches));
    const total=all.length, pages=Math.max(1,Math.ceil(total/PS));
    if(state.page>pages) state.page=pages;
    if(state.page<1) state.page=1;
    const start=(state.page-1)*PS, list=all.slice(start,start+PS);
    const tb=$('tbody'); tb.textContent='';
    const frag=document.createDocumentFragment();
    list.forEach(r=>{
      const tr=h('tr',{class:'row'});
      TCOLS.forEach(([name,,cls])=>{
        if(name==='How sure'){
          const v=col(r,name); const g=h('td');
          g.append(h('span',{class:'badge b-'+sureClass(v),text:sureLabel(v),'data-tip':tipText(sureLabel(v),keyMeaning('How sure',v))}));
          tr.append(g);
        } else tr.append(td(col(r,name),cls));
      });
      tr.addEventListener('click',e=>{
        if(e.target.closest&&e.target.closest('a')) return;
        const next=tr.nextSibling;
        if(next && next.classList && next.classList.contains('detail')){ next.remove(); tr.classList.remove('open'); }
        else { tr.after(detailRow(r)); tr.classList.add('open'); }
      });
      frag.append(tr);
    });
    tb.append(frag);
    $('empty').hidden=total>0;
    const cnt=$('count'); cnt.textContent='';
    if(total) cnt.append('Showing ',h('b',{text:`${start+1}-${start+list.length}`}),' of ',h('b',{text:String(total)}),' companies');
    else cnt.append('Showing ',h('b',{text:'0'}),' of ',h('b',{text:'0'}),' companies');

  function renderChips(){

  function clearAll(){ Object.assign(state,{q:'',layer:'',type:'',kind:'',event:'',sure:'',country:'',level:'',page:1}); syncControls(); renderTable(); }
  function renderPager(pages){
    const box=$('pager'); box.textContent='';
    const prev=h('button',{class:'btn small',type:'button',text:'Previous'});
    const next=h('button',{class:'btn small',type:'button',text:'Next'});

  function buildKpis(){

/* ---------- reading data.csv ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const first=text.split('\n')[0]||'';
  const count=ch=>first.split(ch).length-1;
  const delim=count('\t')>count(',')&&count('\t')>count(';')?'\t':(count(';')>count(',')?';':',');
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else if(c==='"'){ q=true; }
    else if(c===delim){ row.push(field); field=''; }
    else if(c==='\r'){ /* ignore */ }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
const EXPECTED=['Region','S.No','Company','Layer','Type','Supply chain level','Company kind','HQ','Country','City','Where they operate','What they make or do','Sells to','What happened','How sure','Latest update','Source','Last updated'];
function buildData(rows){
  if(rows.length<2) throw new Error('The data file has no company rows.');
  const norm=s=>String(s).replace(/\s+/g,' ').trim().toLowerCase();
  const head=rows[0].map(c=>{ const n=norm(c); return EXPECTED.find(e=>norm(e)===n)||String(c).replace(/\s+/g,' ').trim(); });
  const missing=['Region','Company','Layer'].filter(c=>!head.includes(c));
  if(missing.length) throw new Error('These column names are missing in the first row of the data file: '+missing.join(', ')+'. Column names must match the original ones exactly.');
  const ri=head.indexOf('Region'), ci=head.indexOf('Company'), si=head.indexOf('How sure'), ui=head.indexOf('Last updated');
  const by=new Map();
  rows.slice(1).forEach(r=>{
    const cells=head.map((_,i)=>String(r[i]==null?'':r[i]).trim());
    if(!cells[ci]) return;
    if(si>=0&&cells[si]==='') cells[si]='-';
    const region=cells[ri]||'Not stated';
    if(!by.has(region)) by.set(region,[]);
    by.get(region).push(cells);
    if(ui>=0&&/^\d{4}-\d{2}-\d{2}/.test(cells[ui])&&cells[ui]>DATA_DATE) DATA_DATE=cells[ui].slice(0,10);
  });
  if(!by.size) throw new Error('No companies were found in the data file.');
  const regions=[...by.keys()].sort((a,b)=>(a==='India'?-1:b==='India'?1:0));
  const data={};
  regions.forEach(label=>{
    const key=(label.toLowerCase().replace(/[^a-z0-9]/g,'')||'region');
    data[key]={key,label,tab:label,cols:head,rows:by.get(label)};
  });
  return data;
}
function setHash(name){ try{ history.replaceState(null,'','#'+name); }catch(e){ location.hash=name; } }
const instances={};
function showMarket(key,view,push){
  if(!instances[key]) key=Object.keys(instances)[0];
  hideTip();
  Object.keys(instances).forEach(k=>{
    document.getElementById('market-'+k).hidden=k!==key;
    const b=document.getElementById('mkt-'+k); b.classList.toggle('active',k===key); b.setAttribute('aria-selected',String(k===key));
  });
  instances[key].show(view||'companies',false);
  if(push) setHash(key+((view&&view!=='companies')?'-'+view:''));
}
function routeFromHash(){
  const parts=(location.hash||'').replace('#','').split('-');
  showMarket(parts[0],parts[1]||'companies',false);
}
function showProblem(err){
  const box=document.getElementById('app');
  box.textContent='';
  const onDisk=location.protocol==='file:';
  box.append(h('div',{class:'problem',role:'alert'},
    h('h3',{text:onDisk?'Open this page from its web link':'The data could not be loaded'}),
    h('p',{text:onDisk
      ? 'You opened this page by double-clicking the file on your computer. Browsers do not allow a page to read data.csv that way. Open the page from your GitHub Pages link instead (see the README for how to get it).'
      : String(err&&err.message||err)}),
    onDisk?null:h('p',{text:`Check that ${CONFIG.dataFile} is in the same folder as index.html, that its name is exactly ${CONFIG.dataFile}, and that the first row holds the column names.`})
  ));
}
async function fetchText(url,optional){
  const res=await fetch(url,{cache:'no-cache'});
  if(!res.ok){ if(optional) return ''; throw new Error(`Could not find ${url} (error ${res.status}). The page looked for it at this address: ${new URL(url,location.href).href}`); }
  return res.text();
}
(async function start(){
  try{
    const text=await fetchText(CONFIG.dataFile,false);
    DATA=buildData(parseCSV(text));
    try{ const k=await fetchText(CONFIG.keyFile,true); if(k){ const kr=parseCSV(k); KEY=kr.slice(1).map(r=>[0,1,2].map(i=>String(r[i]||'').trim())).filter(r=>r[0]); } }catch(e){ KEY=[]; }
    Object.keys(DATA).forEach(k=>{ MARKETS[k]=DATA[k]; });
    document.getElementById('topsub').textContent=`Source: ${CONFIG.dataFile}, from the Google Sheet “${SHEET_TITLE}”.`+(DATA_DATE?` Newest update in the data: ${DATA_DATE}.`:'');
    const app=document.getElementById('app'); app.textContent='';
    const bar=h('div',{class:'markets',role:'tablist',id:'markets'}); app.append(bar);
    Object.keys(MARKETS).forEach(k=>app.append(h('div',{id:'market-'+k,hidden:'hidden'})));
    Object.keys(MARKETS).forEach(k=>{
      const M=MARKETS[k];
      const b=h('button',{class:'mkt',role:'tab',id:'mkt-'+k},M.label,h('span',{class:'pill',text:String(M.rows.length)}));
      b.addEventListener('click',()=>{ showMarket(k,'companies',true); window.scrollTo(0,0); });
      bar.append(b);
      instances[k]=createMarket(M);
    });
    window.addEventListener('hashchange',routeFromHash);
    routeFromHash();
  }catch(err){ showProblem(err); }
})();

/* ===== hover information ===== */
const tipBox = document.createElement('div');
tipBox.className = 'tip'; tipBox.id = 'tip'; tipBox.setAttribute('role', 'tooltip');
document.body.append(tipBox);
function showTip(el, x, y) {
  const raw = el.getAttribute('data-tip');
  if (!raw) return hideTip();
  tipBox.replaceChildren();
  raw.split('|').filter(Boolean).forEach((p, i) => {
    const d = document.createElement('div');
    if (!i) d.className = 'tip-h';
    d.textContent = p;
    tipBox.append(d);
  });
  tipBox.style.display = 'block';
  const w = tipBox.offsetWidth, hh = tipBox.offsetHeight;
  tipBox.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tipBox.style.top = (y + 18 + hh > window.innerHeight ? Math.max(8, y - hh - 12) : y + 18) + 'px';
}
function hideTip() { tipBox.style.display = 'none'; }
document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('mouseleave', hideTip);
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 12); } });
document.addEventListener('focusout', hideTip);
window.addEventListener('scroll', hideTip, true);
